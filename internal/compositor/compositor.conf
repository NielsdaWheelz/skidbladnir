# The compositor is private to one browser and starts with only pane %0.
set -s escape-time 0
set -g assume-paste-time 0
set -s extended-keys always
set -s extended-keys-format csi-u
set -s focus-events on
set -s set-clipboard on
set -s get-clipboard off
set -s default-terminal tmux-256color
set -as terminal-features 'xterm-ghostty:256:RGB:bpaste:clipboard:mouse:strikethrough:title:ccolour:cstyle:extkeys:focus:margins:overline:hyperlinks:osc7:sync:usstyle'
set -g status off
# The detach exit-status command needs a shell without user startup files.
set -g default-shell /bin/sh
set -g prefix None
set -g prefix2 None
set -g mouse on
set -g history-limit 100
set -g set-titles on
set -g set-titles-string '#{pane_title}'
set -g allow-rename off
setw -g allow-passthrough on
setw -g pane-border-style default
setw -g pane-active-border-style default
setw -g pane-border-lines single
setw -g pane-border-indicators off
setw -g remain-on-exit on
setw -g remain-on-exit-format ''

set -s @skid_live 0
set -s @skid_returns 0
set -s @skid_status -1
set -s @skid_rail_drag 0

# Tmux can otherwise send unbound modified mouse events to an inactive pane.
set -s command-alias[17] "skid-select-stage=select-pane -e -t %1 ; select-pane -d -t %0 ; select-pane -t %1"
set -s command-alias[18] "skid-select-rail=select-pane -e -t %0 ; select-pane -d -t %1 ; select-pane -t %0"

# The visit branch is also used before spawning the stage at its final size.
# Command aliases in quoted branch strings are expanded when the branch runs.
set -s command-alias[10] "skid-visit-layout=if -F -t %1 \
    '#{&&:#{pane_active},#{e|<:#{window_width},SPLIT_COLUMNS}}' \
    { if -F -t %1 '#{window_zoomed_flag}' {} { resize-pane -Z -t %1 } } \
    { if -F -t %1 '#{window_zoomed_flag}' { resize-pane -Z -t %1 } ; \
      resize-pane -t %0 -x RAIL_COLUMNS }"
set -s command-alias[11] "skid-layout=if -F -t %0 '#{==:#{window_panes},2}' { \
    if -F '#{@skid_live}' 'skid-visit-layout' { \
        if -F -t %0 '#{&&:#{pane_active},#{window_zoomed_flag}}' {} \
            'skid-select-rail ; if -F -t %0 \"#{window_zoomed_flag}\" {} { resize-pane -Z -t %0 }' \
    } \
}"
set -s command-alias[12] "skid-wake=if -F -t %0 '#{&&:#{@skid_ready},#{?pane_dead,0,1}}' \
    { run-shell -b -t %0 'kill -USR1 #{pane_pid}' }"
set -s command-alias[13] "skid-mark-return=set -sF @skid_returns '#{e|+:#{@skid_returns},1}'"
set -s command-alias[14] "skid-stage-keys=if -F -t %1 '#{?pane_active,0,1}' 'skid-select-stage ; skid-mark-return'"
set -s command-alias[15] "skid-retire=respawn-pane -kE -t %1 ; set -s @skid_live 0 ; set -s @skid_end"
set -s command-alias[16] "skid-rail-keys=if -F -t %0 '#{e|<:#{window_width},SPLIT_COLUMNS}' 'skid-retire narrow' 'skid-select-rail'"
set -s command-alias[19] "skid-press=if -F -t = '#{==:#{pane_id},%0}' \
    'set -s @skid_rail_drag 0 ; if -F \"#{@skid_live}\" skid-select-rail ; if -F -t = \"#{mouse_any_flag}\" { send-keys -M }' \
    \"if -F '#{@skid_live}' 'skid-stage-keys ; if -F -t = \\\"#{mouse_any_flag}\\\" { send-keys -M }'\""

set-hook -g after-new-session 'set -s exit-unattached on ; set -g destroy-unattached on'
set-hook -g window-resized "if -F -t %0 \
    '#{&&:#{@skid_live},#{&&:#{pane_active},#{e|<:#{window_width},SPLIT_COLUMNS}}}' \
    'skid-retire narrow' ; skid-layout ; skid-wake"
set-hook -g window-pane-changed 'skid-layout ; skid-wake'
set-hook -g pane-died "if -F '#{==:#{hook_pane},%0}' \
    { run-shell -C -t %0 'detach-client -s skid -E \"exit #{?#{==:#{pane_dead_status},},1,#{pane_dead_status}}\"' } \
    { if -F '#{@skid_live}' { \
        set -s @skid_live 0 ; set -s @skid_end exit ; \
        set -sF -t %1 @skid_status '#{?#{==:#{pane_dead_status},},-1,#{pane_dead_status}}' \
      } \
    } ; skid-layout ; skid-wake"

unbind -a -T root
bind -n C-] if -F '#{==:#{pane_id},%0}' 'send-keys C-]' 'skid-rail-keys ; skid-layout'
# An inner tmux in extended-key mode 2 misparses CSI 1~ / 4~.
bind -n Home send-keys -H 1b 4f 48
bind -n End send-keys -H 1b 4f 46
bind -n MouseDown1Pane skid-press
bind -n SecondClick1Pane skid-press
bind -n TripleClick1Pane skid-press
# Latch the drag before tmux can drop out-of-pane motion or reclassify its end.
bind -n MouseUp1Pane if -F -t = '#{&&:#{pane_active},#{&&:#{mouse_any_flag},#{||:#{==:#{pane_id},%1},#{==:#{@skid_rail_drag},0}}}}' { send-keys -M }
bind -n MouseDrag1Pane if -F -t = '#{&&:#{pane_active},#{mouse_any_flag}}' {
    if -F -t = '#{==:#{pane_id},%0}' { set -s @skid_rail_drag 1 }
    send-keys -M
}
bind -n MouseDragEnd1Pane if -F -t = '#{&&:#{==:#{pane_id},%1},#{&&:#{pane_active},#{mouse_any_flag}}}' { send-keys -M }
bind -n WheelUpPane if -F -t = '#{&&:#{pane_active},#{mouse_any_flag}}' { send-keys -M }
bind -n WheelDownPane if -F -t = '#{&&:#{pane_active},#{mouse_any_flag}}' { send-keys -M }
