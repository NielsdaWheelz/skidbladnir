<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
    <title>Skíðblaðnir terminal platform harness</title>
    <link rel="stylesheet" href="vendor/xterm-5.3.0.css">

<body>
<main aria-label="Terminal platform harness">
